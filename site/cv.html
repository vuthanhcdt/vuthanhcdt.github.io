<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curriculum Vitae · RASL</title>
<meta name="description" content="Curriculum vitae of RASL members, generated from the lab's member and publication data.">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b1424;--ink-2:#36415a;--muted:#6a7486;--line:#e4e8ef;--soft:#f3f6fb;
  --accent:#0a66d8;--accent-2:#00a3a3;--accent-soft:#e8f1fd;
  --navy-1:#06101f;--navy-2:#0d2b52;
  --journal:#5b3fd6;--conf:#1f5fd6;--pre:#b4540a;
  --bg:#e9edf3;--paper:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- toolbar (screen only) ---------- */
.bar{position:sticky;top:0;z-index:5;background:rgba(6,16,31,.92);backdrop-filter:blur(10px);color:#fff}
.bar .in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .brand{display:flex;align-items:center;gap:8px;color:#fff;font:700 1.05rem "Space Grotesk"}
.bar .brand img{width:26px;height:26px;filter:invert(1)}
.bar .brand:hover{text-decoration:none}
.bar .sp{flex:1}
.bar select,.bar button,.bar a.b{font:600 .84rem Inter;height:36px;padding:0 14px;border-radius:9px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.bar a.b:hover{text-decoration:none;background:rgba(255,255,255,.12)}
.bar button.primary{background:#fff;color:#0b1424;border-color:#fff}
.bar svg{width:16px;height:16px}
.bar select option{color:#0b1424}

/* ---------- sheet ---------- */
.sheet{width:min(210mm,100% - 32px);margin:24px auto 48px;background:var(--paper);box-shadow:0 14px 50px rgba(6,16,31,.14);border-radius:8px;overflow:hidden}

/* header band */
.hero{position:relative;overflow:hidden;color:#fff;padding:26px 30px 22px;
  background:radial-gradient(500px 260px at 92% -10%,rgba(62,224,208,.28),transparent 60%),linear-gradient(135deg,var(--navy-1),var(--navy-2))}
.hero .wm{position:absolute;right:-24px;bottom:-40px;width:210px;opacity:.08;filter:invert(1);pointer-events:none}
.hero-top{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center}
.qr{display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 8px 7px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16)}
.qr:hover{text-decoration:none;background:rgba(255,255,255,.12)}
.qr .tile{width:96px;height:96px;padding:5px;border-radius:12px;background:#fff;transition:transform .2s}
.qr:hover .tile{transform:scale(1.03)}
.qr svg{display:block;width:100%;height:100%}
.qr .cap{text-align:center;line-height:1.2;font-size:.62rem;color:#b9d4f5}
.qr .cap b{display:block;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:#7fe0d6;font-weight:700;margin-bottom:1px}
.hero-top img.ph{width:104px;height:104px;border-radius:50%;object-fit:cover;object-position:center bottom;background:radial-gradient(circle at 50% 30%,#eaf3ff,#9cc7ff);border:3px solid rgba(255,255,255,.9);box-shadow:0 0 0 6px rgba(111,182,255,.25)}
.hero h1{font:700 2rem/1.05 "Space Grotesk";letter-spacing:-.015em;margin:0}
.hero .role{margin:6px 0 12px;color:#9fd2ff;font-weight:600;font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:#e6f0ff;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.chips a:hover{text-decoration:none;background:rgba(255,255,255,.14)}
.chips svg{width:13px;height:13px;opacity:.9}
.chips a.scholar{padding-left:4px}
/* three contact links always sit on one tidy row */
.chips{flex-wrap:nowrap;gap:6px}
.chips a{white-space:nowrap;font-size:.74rem;padding:4px 10px;gap:5px}
.gs{width:18px!important;height:18px!important;border-radius:5px!important}
.gs{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:#4285f4;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.gs svg{width:15px!important;height:15px!important;opacity:1!important}
.kpis{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin-top:18px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(255,255,255,.04)}
.kpis div{padding:10px 14px;border-left:1px solid rgba(255,255,255,.1);display:flex;align-items:baseline;gap:8px;justify-content:center;white-space:nowrap}
.kpis div:first-child{border-left:0}
.kpis b{font:700 1.45rem "Space Grotesk";background:linear-gradient(90deg,#6fb6ff,#3ee0d0);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpis span{font-size:.74rem;color:#b9c9e2}

/* body */
.body{padding:8px 30px 22px}
.sec{padding:18px 0 4px;border-top:1px solid var(--line);break-inside:auto}
.sec:first-child{border-top:0}
.sh{display:flex;align-items:center;gap:10px;margin:0 0 12px;break-after:avoid;break-inside:avoid}
.sh i{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.sh i svg{width:15px;height:15px}
.sh h2{font:700 .82rem "Space Grotesk";letter-spacing:.16em;text-transform:uppercase;margin:0;color:var(--ink)}
.sh::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent-soft),transparent)}
.sh .cnt{font:600 .7rem Inter;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px;order:3}
p.lead{margin:0;color:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-size:.74rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}

/* timeline (education / experience) */
.tl{position:relative;margin:0;padding:0 0 0 18px;list-style:none}
.tl::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--accent),rgba(10,102,216,.12));border-radius:2px}
.tl li{position:relative;display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:3px 0 10px;break-inside:avoid}
.tl li::before{content:"";position:absolute;left:-18px;top:6px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.tl li:first-child::before{background:var(--accent)}
.tl b{font-weight:650;color:var(--ink)}
.tl .when{font-style:normal;grid-column:2;grid-row:1;font-size:.75rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:999px;white-space:nowrap;align-self:start}
.tl span{grid-column:1/-1;color:var(--ink-2);font-size:.84rem}
.tl .adv{font-size:.8rem;color:var(--muted);margin-top:1px}
.tl .adv a{color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:5px}
.gsm{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:4px;background:#4285f4;font-style:normal}
.gsm svg{width:11px;height:11px}

/* publications */
.pg{margin:4px 0 14px}
.pg h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:.84rem;color:var(--ink-2);break-after:avoid}
.pg h3 em{font-style:normal;font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:999px;color:#fff}
/* top-tier conferences: same look as the other groups, in the CV navy */
.pg.top h3 em{background:var(--navy-2)!important}
.pg.top .ven{background:var(--navy-2)!important}
.pg.top .k{color:var(--navy-2)}
.pg.Journal h3 em{background:var(--journal)}.pg.Conference h3 em{background:var(--conf)}.pg.Preprint h3 em{background:var(--pre)}
.pub{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:7px 8px;border-radius:8px;break-inside:avoid}
.pub .k{font:700 .74rem "Space Grotesk";color:var(--accent);padding-top:1px}
.pg.Journal .k{color:var(--journal)}.pg.Preprint .k{color:var(--pre)}
.pt{font-weight:600;color:var(--ink);line-height:1.4}
a.pt:hover{color:var(--accent)}
.pa{color:var(--ink-2);font-size:.82rem}
.pa b{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.pv{color:var(--muted);font-size:.8rem}
.pv i{font-style:italic}
.ven{display:inline-block;font:700 .62rem Inter;letter-spacing:.04em;padding:1px 6px;border-radius:4px;color:#fff;margin-right:6px;vertical-align:1px}
.pg.Journal .ven{background:var(--journal)}.pg.Conference .ven{background:var(--conf)}.pg.Preprint .ven{background:var(--pre)}

/* compact list cards (honors / service) */
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:6px 0 6px 14px;border-bottom:1px dashed var(--line);position:relative;break-inside:avoid}
.rows li:last-child{border-bottom:0}
.rows li::before{content:"";position:absolute;left:0;top:13px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.rows li span{color:var(--ink-2);font-size:.86rem;line-height:1.45}
.rows li b{color:var(--ink);font-weight:650}
.rows li em{flex:none;font-style:normal;font-size:.74rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:999px;white-space:nowrap}
.cards{display:grid;gap:8px}
.cards div{padding:9px 12px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;break-inside:avoid}
.cards b{display:block;font-weight:650}
.cards span{color:var(--ink-2);font-size:.82rem}
.cards em{float:right;font-style:normal;font-size:.72rem;font-weight:700;color:var(--accent)}

.upd{margin:0;padding:6px 30px 18px;font-size:.72rem;font-style:italic;color:var(--muted);text-align:right}
.missing{max-width:520px;margin:80px auto;text-align:center;color:var(--ink-2)}
/* password-protected full CV */
.bar .lockbtn.on{background:rgba(62,224,208,.18);border-color:#3ee0d0}
.pw{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(4,10,20,.55);backdrop-filter:blur(5px)}
.pw[hidden]{display:none}
.pw-box{width:min(380px,100%);background:#fff;border-radius:18px;padding:26px 24px 20px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.pw-ic{width:52px;height:52px;margin:0 auto 10px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.pw-ic svg{width:26px;height:26px}
.pw-box h2{font:700 1.3rem "Space Grotesk";margin:0 0 6px}
.pw-box p{margin:0 0 16px;color:var(--ink-2);font-size:.88rem}
.pw-box input{width:100%;font:inherit;font-size:1rem;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--soft)}
.pw-box input:focus{outline:2px solid rgba(10,102,216,.35);border-color:var(--accent)}
.pw-box small{display:block;min-height:1.2em;margin:6px 0 0;color:#e5484d;font-size:.8rem}
.pw-act{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.pw-act button{font:600 .9rem Inter;padding:10px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.pw-act button.ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.pw-act button:disabled{opacity:.6;cursor:wait}
.hl{display:inline-block;margin-left:8px;font:700 .64rem Inter;letter-spacing:.04em;padding:2px 8px;border-radius:999px;color:#fff;background:linear-gradient(90deg,#0a66d8,#00a3a3);vertical-align:2px;white-space:nowrap}
.tl span .hl{color:#fff;font-size:.64rem;grid-column:auto}
.st{display:inline-block;font:700 .62rem Inter;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:4px;margin-left:6px;vertical-align:1px}
.st.review{background:#fef3c7;color:#92400e}
.st.revision{background:#ede9fe;color:#5b21b6}

/* phone layout is for the screen only — printing / "Download PDF" always uses the desktop A4 layout */
@media screen and (max-width:680px){
  .sheet{border-radius:14px}
  .hero{padding:22px 18px}
  .hero-top{grid-template-columns:1fr;text-align:center}
  .qr{margin:4px auto 0}
  .hero-top img.ph{margin:0 auto}
  .chips{justify-content:center}
  .kpis{grid-template-columns:1fr 1fr}
  .kpis div:nth-child(3){border-left:0}
  .kpis div:nth-child(n+3){border-top:1px solid rgba(255,255,255,.1)}
  .body{padding:4px 18px 18px}
  .two{grid-template-columns:1fr}
  .two > .sec:nth-child(2){border-top:1px solid var(--line)}
  .tl li{grid-template-columns:1fr}
  .tl .when{grid-column:1;grid-row:auto;justify-self:start}
  .pub{grid-template-columns:1fr}
  /* keep everything inside the phone width */
  .sheet,.hero,.hero-top,.hero-top > *,.body,.sec{min-width:0;max-width:100%}
  .hero h1{font-size:1.55rem;overflow-wrap:anywhere}
  .hero .role{font-size:.85rem}
  .chips{flex-wrap:wrap;justify-content:center}
  .kpis{grid-auto-flow:row;grid-template-columns:1fr 1fr}
  .kpis div{justify-content:flex-start;padding:10px 12px}
  .kpis div:nth-child(odd){border-left:0}
  .kpis div:nth-child(even){border-left:1px solid rgba(255,255,255,.1)}
  .kpis div:nth-child(n+3){border-top:1px solid rgba(255,255,255,.1)}
  .rows li{flex-direction:column;gap:4px}
  .rows li em{align-self:flex-start}
  .pt,.pa,.pv,.tl span,p.lead{overflow-wrap:anywhere}
  .bar{position:static}
  .bar .in{gap:8px}
  .bar select{max-width:46vw}
}

/* ---------- print / Save as PDF ---------- */
/* A4; every page gets top/bottom margins except the first, where the dark header runs to the edge */
@page{size:A4 portrait;margin:11mm 0 10mm}
@page :first{margin-top:0}
@media print{
  html,body{background:#fff;width:210mm;min-width:210mm}
  body{font-size:9.8pt}
  .bar{display:none}
  .sheet{width:auto;margin:0;box-shadow:none;border-radius:0;overflow:visible}
  .body{padding:4mm 14mm 6mm}
  .hero{padding:10mm 14mm 7mm}
  .upd{padding:1mm 14mm 4mm}
  a{color:inherit}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sec{break-inside:auto}
  .pub,.tl li,.cards div{break-inside:avoid}
  .sh,.pg h3{break-after:avoid;page-break-after:avoid}
  .pg h3 + .pub{break-before:avoid}
  /* PDF renderers mishandle blurred shadows and gradient-clipped text */
  .qr{background:rgba(255,255,255,.07)}
  .hero-top img.ph{box-shadow:none}
  .kpis b{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#5fd4e8}
  .kpis{backdrop-filter:none}
  /* tighter rhythm on paper */
  body{font-size:9.1pt}
  .sec{padding-top:10px}
  .sh{margin-bottom:9px}
  .tl li{padding:2px 0 7px}
  .pub{padding:4px 8px;gap:8px}
  .pg{margin:2px 0 10px}
  .cards{gap:6px}
  .cards div{padding:6px 10px}
  .hero{padding:9mm 14mm 6mm}
  .tags{margin-top:7px}
}
</style>
</head>
<body>
<div class="bar">
  <div class="in">
    <a class="brand" href="index.html"><img src="assets/rasl-logo.png" alt="">RASL</a>
    <span class="sp"></span>
    <select id="who" aria-label="Choose member"></select>
    <a class="b" href="people.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>People</a>
    <button class="b lockbtn" id="full" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>Full CV</span></button>
    <button class="primary" id="pdf" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Download PDF</button>
  </div>
</div>
<main id="cv"></main>
<div class="pw" id="pw" hidden>
  <form class="pw-box" id="pwForm" autocomplete="off">
    <div class="pw-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h2>Full CV</h2>
    <p>Includes manuscripts currently under review or revision. Enter the password to unlock it.</p>
    <input id="pwIn" type="password" placeholder="Password" aria-label="Password" required>
    <small id="pwErr" role="alert"></small>
    <div class="pw-act"><button type="button" class="ghost" id="pwCancel">Cancel</button><button type="submit" id="pwGo">Unlock</button></div>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="assets/pubs.js?v=619eee3e"></script>
<script src="assets/members.js?v=7d8204eb"></script>
<script src="assets/site-meta.js?v=bebca26c"></script>
<script>
(() => {
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const M = window.MEMBERS || [], P = window.PUBS || [];
const params = new URLSearchParams(location.search);
const m = M.find(x => x.id === params.get("m")) || M[0];
const root = document.getElementById("cv");

const who = document.getElementById("who");
who.innerHTML = M.map(x => `<option value="${esc(x.id)}"${x === m ? " selected" : ""}>${esc(x.name)}</option>`).join("");
who.hidden = M.length < 2;
who.addEventListener("change", () => { location.search = "?m=" + encodeURIComponent(who.value); });
document.getElementById("pdf").addEventListener("click", () => window.print());

if (!m){ root.innerHTML = `<div class="missing">No member data found.</div>`; return; }
document.title = `CV_${m.name.replace(/\s+/g, "_")}`;   // default PDF file name

/* icons */
const I = {
  user:'<path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/>',
  edu:'<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
  work:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>',
  book:'<path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5z"/><path d="M8 7h7M8 11h7"/>',
  award:'<circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 7 5-3 5 3-1.5-7"/>',
  serv:'<path d="M12 3 4 7v6c0 4 3.5 7 8 8 4.5-1 8-4 8-8V7z"/><path d="m9 12 2 2 4-4"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  link:'<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>'
};
/* QR code (SVG) for the member's website; empty if the library failed to load */
const qr = text => {
  if (typeof qrcode !== "function") return "";
  const q = qrcode(0, "H"); q.addData(text); q.make();          // level H: survives the centre logo
  const n = q.getModuleCount(), ink = "#0d2b52";
  const eye = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
  const hole = Math.ceil(n * 0.22), h0 = Math.floor((n - hole) / 2);   // keep the centre clear for the logo
  let dots = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (eye(r, c) || (r >= h0 && r < h0 + hole && c >= h0 && c < h0 + hole)) continue;
    if (q.isDark(r, c)) dots += `<circle cx="${c + .5}" cy="${r + .5}" r=".46"/>`;
  }
  const eyeAt = (x, y) => `<rect x="${x + .5}" y="${y + .5}" width="6" height="6" rx="1.8" fill="none" stroke="${ink}" stroke-width="1"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" rx=".9" fill="${ink}"/>`;
  const L = h0 + .4, S = hole - .8;
  return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" role="img" aria-label="QR code to ${esc(text)}">
    <g fill="${ink}">${dots}</g>${eyeAt(0, 0)}${eyeAt(n - 7, 0)}${eyeAt(0, n - 7)}
    <rect x="${L}" y="${L}" width="${S}" height="${S}" rx="${S * .28}" fill="${ink}"/>
    <image href="assets/rasl-logo.png" x="${L + S * .14}" y="${L + S * .14}" width="${S * .72}" height="${S * .72}" style="filter:invert(1)"/>
  </svg>`;
};
const GS_MINI = `<i class="gsm"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 4 2 9.5l10 5.5 8-4.4V16h2V9.5L12 4zM6 13.2V16c0 1.7 2.7 3.5 6 3.5s6-1.8 6-3.5v-2.8l-6 3.3-6-3.3z"/></svg></i>`;
/* Google Scholar mark: blue tile with the white mortarboard */
const GS = `<span class="gs"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 4 2 9.5l10 5.5 8-4.4V16h2V9.5L12 4zM6 13.2V16c0 1.7 2.7 3.5 6 3.5s6-1.8 6-3.5v-2.8l-6 3.3-6-3.3z"/></svg></span>`;
const chip = c => {
  if (c.url.startsWith("mailto:")) return `<a href="${esc(c.url)}">${ic("mail")}${esc(c.text)}</a>`;
  if (/scholar\.google\./.test(c.url)) return `<a class="scholar" href="${esc(c.url)}">${GS}Scholar</a>`;
  return `<a href="${esc(c.url)}">${ic("link")}${esc(c.label + " · " + c.text)}</a>`;
};
const ic = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const sec = (icon, title, body, count) => body ? `<section class="sec"><div class="sh"><i>${ic(icon)}</i><h2>${title}</h2>${count ? `<span class="cnt">${count}</span>` : ""}</div>${body}</section>` : "";

/* papers authored by this member */
const me = m.pubName || m.name;
const mine = P.filter(p => p.a.split(/,\s*/).includes(me));
const J = mine.filter(p => p.c === "Journal"), C = mine.filter(p => p.c === "Conference"), R = mine.filter(p => p.c === "Preprint");
const TOP = window.TOP_TIER || [];
const CT = C.filter(p => TOP.includes(p.s)), CO = C.filter(p => !TOP.includes(p.s));
let FULL = false;                                   // true while the password-protected full CV is shown
const pubItem = (p, key) => {
  const title = (p.u ? `<a class="pt" href="${esc(p.u)}">${esc(p.t)}</a>` : `<span class="pt">${esc(p.t)}</span>`)
    + (FULL && p.h ? `<span class="hl">★ ${esc(p.h)}</span>` : "");
  const doi = p.doi ? ` doi: <a href="https://doi.org/${esc(p.doi)}">${esc(p.doi)}</a>` : "";
  return `<div class="pub"><span class="k">[${key}]</span><div>${title}
    <div class="pa">${esc(p.a).replace(esc(me), `<b>${esc(me)}</b>`)}</div>
    <div class="pv"><span class="ven">${esc(p.s)}</span><i>${esc(p.v)}</i>${p.i ? ", " + esc(p.i) : ""}.${doi}</div></div></div>`;
};
const group = (cls, label, list, prefix, start = 0) => list.length
  ? `<div class="pg ${cls}"><h3>${label}<em>${list.length}</em></h3>${list.map((p, i) => pubItem(p, prefix + (start + i + 1))).join("")}</div>` : "";

const timeline = list => list?.length ? `<ul class="tl">${list.map(r =>
  `<li><b>${esc(r.what)}</b>${r.when ? `<em class="when">${esc(r.when)}</em>` : ""}<span>${esc(r.where || "")}${FULL && r.badge ? `<span class="hl">★ ${esc(r.badge)}</span>` : ""}</span>${r.advisor ? `<span class="adv">Advisor: <a href="${esc(r.advisor.url)}">${GS_MINI}${esc(r.advisor.name)}</a></span>` : ""}</li>`).join("")}</ul>` : "";
/* one line per entry: bold title — where, date on the right */
const rows = list => list?.length ? `<ul class="rows">${list.map(r =>
  `<li><span><b>${esc(r.what)}</b>${r.where ? ` — ${esc(r.where)}` : ""}</span>${r.when ? `<em>${esc(r.when)}</em>` : ""}</li>`).join("")}</ul>` : "";
const cards = list => list?.length ? `<div class="cards">${list.map(r =>
  `<div>${r.when ? `<em>${esc(r.when)}</em>` : ""}<b>${esc(r.what)}</b><span>${esc(r.where || "")}</span></div>`).join("")}</div>` : "";
/* "Updated" = the date the website was last built (assets/site-meta.js), not the day the CV is opened */
const built = window.SITE_UPDATED ? new Date(window.SITE_UPDATED + "T12:00:00") : new Date();
const today = built.toLocaleDateString("en-US", {year:"numeric", month:"long", day:"numeric"});

/* manuscripts under review / revision (only after the password unlocks them) */
const urItem = (p, key) => {
  const st = /revision/i.test(p.status || "") ? "revision" : "review";
  return `<div class="pub"><span class="k">[${key}]</span><div><span class="pt">${esc(p.title)}</span>
    <div class="pa">${esc(p.authors || "").replace(esc(me), `<b>${esc(me)}</b>`)}</div>
    <div class="pv">${p.short ? `<span class="ven">${esc(p.short)}</span>` : ""}<i>${esc(p.venue || "")}</i>${p.submitted ? `, submitted ${esc(p.submitted)}` : ""}.<span class="st ${st}">${esc(p.status || "Under review")}</span></div></div></div>`;
};
/* journal articles: published papers first, then (full CV only) manuscripts under revision / review in the order of the private list */
const journalGroup = UR => {
  const ur = UR || [], n = J.length + ur.length;
  return n ? `<div class="pg Journal"><h3>Journal Articles<em>${n}</em></h3>${J.map((p, i) => pubItem(p, "J" + (i + 1))).join("")}${ur.map((p, i) => urItem(p, "J" + (J.length + i + 1))).join("")}</div>` : "";
};

const render = UR => { FULL = !!UR; root.innerHTML = `<article class="sheet">
  <header class="hero">
    <img class="wm" src="assets/rasl-logo.png" alt="">
    <div class="hero-top">
      ${m.photo ? `<img class="ph" src="${esc(m.photo)}" alt="Portrait of ${esc(m.name)}">` : ""}
      <div>
        <h1>${esc(m.name)}${m.suffix ? ", " + esc(m.suffix) : ""}</h1>
        ${m.role ? `<p class="role">${esc(m.role)}</p>` : ""}
        <div class="chips">${m.website ? `<a href="${esc(m.website)}">${ic("globe")}${esc(m.website.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</a>` : ""}${(m.contact || []).map(chip).join("")}</div>
      </div>
      ${m.website ? `<a class="qr" href="${esc(m.website)}" title="Open ${esc(m.website)}"><span class="tile">${qr(m.website)}</span><span class="cap"><b>Scan to visit</b>${esc(m.website.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</span></a>` : ""}
    </div>
    ${mine.length ? `<div class="kpis">
      <div><b>${J.length + C.length}</b><span>Peer-reviewed</span></div>
      <div><b>${J.length}</b><span>Journal</span></div>
      ${CT.length ? `<div><b>${CT.length}</b><span>Top-tier conf.</span></div>` : ""}
      <div><b>${C.length}</b><span>Conference</span></div>
      ${R.length ? `<div><b>${R.length}</b><span>Preprint</span></div>` : ""}
      ${UR && UR.length ? `<div><b>${UR.length}</b><span>Under review</span></div>` : ""}
    </div>` : ""}
  </header>
  <div class="body">
    ${sec("user", "Profile", m.summary ? `<p class="lead">${esc(m.summary)}</p>${m.interests?.length ? `<div class="tags">${m.interests.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : ""}` : "")}
    ${sec("edu", "Education", timeline(m.education))}
    ${sec("work", "Research Experience", timeline(m.experience))}
    ${sec("book", "Publications", journalGroup(UR) + group("Conference top", "Top-tier Conference Proceedings", CT, "C") + group("Conference", CT.length ? "Other Conference Proceedings" : "Conference Proceedings", CO, "C", CT.length) + group("Preprint", "Preprints", R, "P"), mine.length ? `${mine.length} published` : "")}
    ${sec("award", "Honors &amp; Awards", rows(m.honors))}
    ${sec("serv", "Professional Service", rows(m.service))}
  </div>
  <p class="upd">Updated ${today}</p>
</article>`; };
render(null);

/* ---------- password-protected full CV ----------
   assets/cv-private.enc = base64 of `openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt` (see tools/encrypt_cv.sh).
   Decrypted in the browser with WebCrypto; the plain list is never stored. */
const fullBtn = document.getElementById("full"), pw = document.getElementById("pw"), pwForm = document.getElementById("pwForm"),
      pwIn = document.getElementById("pwIn"), pwErr = document.getElementById("pwErr"), pwGo = document.getElementById("pwGo");
let blob = null, unlocked = false;
fetch("assets/cv-private.enc", {cache: "no-store"}).then(r => r.ok ? r.text() : null).then(t => {
  if (t && t.trim()){ blob = t.trim(); fullBtn.hidden = false; if (params.get("full") === "1") askPw(); }
}).catch(() => {});
async function decrypt(b64, pass){
  const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  if (new TextDecoder().decode(raw.slice(0, 8)) !== "Salted__") throw new Error("format");
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", salt: raw.slice(8, 16), iterations: 200000, hash: "SHA-256"}, base, 384));
  const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name: "AES-CBC", iv: bits.slice(32, 48)}, key, raw.slice(16));
  return JSON.parse(new TextDecoder().decode(plain));
}
function askPw(){ pw.hidden = false; pwErr.textContent = ""; pwIn.value = ""; setTimeout(() => pwIn.focus(), 30); }
const closePw = () => { pw.hidden = true; fullBtn.focus(); };
fullBtn.addEventListener("click", () => {
  if (unlocked){ unlocked = false; render(null); fullBtn.classList.remove("on"); fullBtn.querySelector("span").textContent = "Full CV"; document.title = `CV_${m.name.replace(/\s+/g, "_")}`; return; }
  askPw();
});
document.getElementById("pwCancel").addEventListener("click", closePw);
pw.addEventListener("click", e => { if (e.target === pw) closePw(); });
addEventListener("keydown", e => { if (e.key === "Escape" && !pw.hidden) closePw(); });
pwForm.addEventListener("submit", async e => {
  e.preventDefault();
  if (!pwIn.value) return;
  pwGo.disabled = true; pwGo.textContent = "Checking…"; pwErr.textContent = "";
  try {
    const data = await decrypt(blob, pwIn.value);
    const UR = (data.manuscripts || []).filter(p => !p.member || p.member === m.id);
    unlocked = true; render(UR); pw.hidden = true;
    fullBtn.classList.add("on"); fullBtn.querySelector("span").textContent = "Public CV";
    document.title = `CV_${m.name.replace(/\s+/g, "_")}_full`;
  } catch(err){
    pwErr.textContent = "Wrong password. Please try again."; pwIn.select();
  } finally {
    pwIn.value = ""; pwGo.disabled = false; pwGo.textContent = "Unlock";
  }
});
})();
</script>
</body>
</html>
