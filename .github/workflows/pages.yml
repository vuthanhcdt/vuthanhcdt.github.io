name: Deploy site to GitHub Pages

# The site is plain static HTML in ./site — nothing to build, just publish it.
on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Renamed from "pages" on 2026-10-19: runs #29–#31 got stuck in "Queued" in the old group and could not be
# cancelled, which blocked every later deploy. A newer push now also replaces an older one still waiting.
concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
